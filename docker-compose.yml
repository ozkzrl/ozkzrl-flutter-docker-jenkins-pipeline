version: '3.8'

services:
  jenkins:
    build: .
    container_name: jenkins-flutter
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock  # BU SATIRI EKLE

volumes:
  jenkins_home:
